[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nse-weekly-breakout"
version = "0.1.0"
description = "Deterministic NSE/BSE weekly compression-breakout research and screening engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
nse-breakout = "nse_weekly_breakout.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
